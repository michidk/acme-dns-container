[general]
listen = "0.0.0.0:5353"
protocol = "both"
domain = "auth.example.com"
nsname = "auth.example.com"
nsadmin = "admin.example.com"
records = [
  "auth.example.com. A 192.0.2.10",
  "auth.example.com. NS auth.example.com.",
]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "8080"
disable_registration = false
tls = "none"
tls_cert_privkey = ""
tls_cert_fullchain = ""
acme_cache_dir = "/var/lib/acme-dns/api-certs"
notification_email = ""
corsorigins = ["*"]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "json"
