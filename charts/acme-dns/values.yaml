replicaCount: 1

image:
  repository: ghcr.io/michidk/acme-dns
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

containerPorts:
  dns: 5353
  api: 8080

config:
  existingConfigMap: ""
  existingSecret: ""
  general:
    listen: 0.0.0.0:5353
    protocol: both
    domain: auth.example.com
    nsname: auth.example.com
    nsadmin: admin.example.com
    records:
      - auth.example.com. A 192.0.2.10
      - auth.example.com. NS auth.example.com.
    debug: false
  database:
    engine: sqlite
    connection: /var/lib/acme-dns/acme-dns.db
  api:
    ip: 0.0.0.0
    port: 8080
    disableRegistration: false
    tls: none
    tlsCertPrivateKey: ""
    tlsCertFullchain: ""
    acmeCacheDir: /var/lib/acme-dns/api-certs
    notificationEmail: ""
    corsOrigins:
      - "*"
    useHeader: false
    headerName: X-Forwarded-For
  log:
    level: info
    type: stdout
    format: json

service:
  dns:
    enabled: true
    type: ClusterIP
    annotations: {}
    port: 53
    loadBalancerIP: ""
    externalTrafficPolicy: Local
  api:
    enabled: true
    type: ClusterIP
    annotations: {}
    port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: auth-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  enabled: true
  scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  scheme: HTTP
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

networkPolicy:
  enabled: false
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30
